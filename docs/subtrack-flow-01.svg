oke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="178" y="78" font-family="SF Pro" font-size="16" font-weight="600" fill="#111" text-anchor="middle">Connect your Gmail</text><circle cx="178" cy="192" r="45" fill="url(#glass)"/><g id="mail" transform="translate(153 167)"><g transform="scale(2.0833333333333335)"><path d="M2 5h20v15H2zM2 6l10 8L22 6" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="26" y="301.0" font-family="SF Pro" font-size="27" font-weight="700" fill="#111" text-anchor="start">Choose the inbox</text><text x="26" y="331.51" font-family="SF Pro" font-size="27" font-weight="700" fill="#111" text-anchor="start">to scan</text><text x="26" y="364.0" font-family="SF Pro" font-size="14" font-weight="400" fill="#777" text-anchor="start">Your sign-in account and your Gmail inbox</text><text x="26" y="383.6" font-family="SF Pro" font-size="14" font-weight="400" fill="#777" text-anchor="start">can be different.</text><g id="Chosen Google account" transform="translate(0 0)"><rect x="18" y="422" width="320" height="84" rx="22" fill="url(#card)" stroke="#ededed" stroke-width=".7"/></g><circle cx="52" cy="464" r="23" fill="#eee"/><text x="52" y="472" font-family="SF Pro" font-size="21" font-weight="600" fill="#111" text-anchor="middle">A</text><text x="89" y="454" font-family="SF Pro" font-size="16" font-weight="600" fill="#111" text-anchor="start">Alex Morgan</text><text x="89" y="477" font-family="SF Pro" font-size="13" font-weight="400" fill="#888" text-anchor="start">alex.morgan@gmail.com</text><g id="chevron" transform="translate(311 454)"><g transform="scale(0.75)"><path d="M9 6l6 6-6 6" fill="none" stroke="#999" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g></g><g id="Read-only access" transform="translate(0 0)"><rect x="18" y="534" width="320" height="105" rx="23" fill="url(#card)" stroke="#ededed" stroke-width=".7"/></g><circle cx="49" cy="569" r="22" fill="#f7f7f7"/><g id="shield" transform="translate(38 558)"><g transform="scale(0.9166666666666666)"><path d="M12 2l9 4v7c0 6-9 10-9 10S3 19 3 13V6zM8 12l3 3 6-7" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="82" y="571" font-family="SF Pro" font-size="16" font-weight="600" fill="#111" text-anchor="start">Read-only access</text><text x="82" y="593.0" font-family="SF Pro" font-size="12" font-weight="400" fill="#777" text-anchor="start">Only billing details are saved. Your</text><text x="82" y="609.8" font-family="SF Pro" font-size="12" font-weight="400" fill="#777" text-anchor="start">emails stay in Gmail.</text><text x="26" y="691.0" font-family="SF Pro" font-size="13" font-weight="400" fill="#777" text-anchor="start">Continue to Google to review access. Scanning</text><text x="26" y="709.2" font-family="SF Pro" font-size="13" font-weight="400" fill="#777" text-anchor="start">starts after you allow it.</text><rect x="20" y="812" width="316" height="49" rx="25" fill="url(#black)"/><text x="178" y="841" font-family="SF Pro" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Continue to Google</text><text x="178" y="889" font-family="SF Pro" font-size="13" font-weight="500" fill="#555" text-anchor="middle">Use another Gmail account</text><rect x="113" y="904" width="130" height="5" rx="3" fill="#606060"/></g><g id="16 Gmail permission declined" transform="translate(406 54)"><rect x="0" y="0" width="356" height="920" rx="36" fill="url(#phone)"/><g id="System Status bar" transform="translate(0 0)"><text x="36" y="30" font-family="SF Pro" font-size="14" font-weight="600" fill="#050505" text-anchor="start">9:41</text><rect x="263" y="26" width="3" height="4" rx="1" fill="#111"/><rect x="267" y="24" width="3" height="6" rx="1" fill="#111"/><rect x="271" y="21" width="3" height="9" rx="1" fill="#111"/><rect x="275" y="18" width="3" height="12" rx="1" fill="#111"/><path d=