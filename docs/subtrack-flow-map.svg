<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1760" viewBox="0 0 1800 1760"><rect width="1800" height="1760" fill="#f4f4f4"/><text x="64" y="78" font-family="SF Pro Display,Arial" font-size="40" font-weight="700" fill="#111">SubTrack · Complete screen flow</text><text x="64" y="116" font-family="SF Pro Display,Arial" font-size="20" font-weight="400" fill="#666">63 screen states · 00–14 existing · 15–62 added · arrows show intended transitions</text><text x="64" y="149" font-family="SF Pro Display,Arial" font-size="18" font-weight="400" fill="#777">Google consent, service cancellation and system settings are external handoffs.</text><g id="Sign in &amp; session"><rect x="48" y="184" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="220" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Sign in &amp; session</text><rect x="440" y="200" width="284" height="45" rx="22" fill="#111"/><text x="458" y="229" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">00–03 Welcome</text><path d="M730 223h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="200" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="229" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">04 Sign in</text><path d="M1043 223h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="200" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="229" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">Google / Apple</text><path d="M1356 223h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="200" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="229" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">05 or 07 Home</text><text x="72" y="281" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">58 Sign-in failure → retry 04. 62 Session renewal → same provider → restore 07.</text></g><g id="Connect Gmail &amp; discover"><rect x="48" y="332" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="368" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Connect Gmail &amp; discover</text><rect x="440" y="348" width="284" height="45" rx="22" fill="#111"/><text x="458" y="377" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">05 → 06 Privacy</text><path d="M730 371h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="348" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="377" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">15 Choose inbox</text><path d="M1043 371h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="348" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="377" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">Google consent</text><path d="M1356 371h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="348" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="377" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">11 Scan → 12 Review</text><text x="72" y="429" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">16 Permission declined → retry / manual. 17 Interrupted → resume / review partial. 18 No results → manual / other inbox.</text></g><g id="Review &amp; import"><rect x="48" y="480" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="516" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Review &amp; import</text><rect x="440" y="496" width="284" height="45" rx="22" fill="#111"/><text x="458" y="525" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">12 Candidates</text><path d="M730 519h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="496" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="525" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">19 Verify details</text><path d="M1043 519h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="496" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="525" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">20 Merge duplicate</text><path d="M1356 519h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="496" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="525" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">21 Imported → 07</text><text x="72" y="577" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">22 Cancellation detected → confirm → 36, or keep active → 09. Only selected, confirmed candidates are imported.</text></g><g id="Manual subscription"><rect x="48" y="628" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="664" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Manual subscription</text><rect x="440" y="644" width="284" height="45" rx="22" fill="#111"/><text x="458" y="673" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">08 → 10 Add</text><path d="M730 667h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="644" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="673" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">23 / 56 Service</text><path d="M1043 667h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="644" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="673" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">24–28 Field pickers</text><path d="M1356 667h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="644" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="673" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">55 Valid → 30 Saved</text><text x="72" y="725" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">29 Validation → correct draft. 52 Save failed → retry same draft. 57 No search results → custom service 56.</text></g><g id="Manage a subscription"><rect x="48" y="776" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="812" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Manage a subscription</text><rect x="440" y="792" width="284" height="45" rx="22" fill="#111"/><text x="458" y="821" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">09 Details → 13 Edit</text><path d="M730 815h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="792" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="821" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">35 Provider cancel</text><path d="M1043 815h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="792" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="821" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">36 Cancelled</text><path d="M1356 815h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="792" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="821" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">37 Delete → 08</text><text x="72" y="873" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">Cancellation happens at the service. SubTrack records the status. Reactivate → set next date 28 → save 13.</text></g><g id="Payments &amp; calendar"><rect x="48" y="924" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="960" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Payments &amp; calendar</text><rect x="440" y="940" width="284" height="45" rx="22" fill="#111"/><text x="458" y="969" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">07 See all → 31</text><path d="M730 963h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="940" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="969" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">31 Calendar → 09</text><path d="M1043 963h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="940" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="969" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">09 Payments → 33</text><path d="M1356 963h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="940" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="969" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">32 Record → 34 Edit</text><text x="72" y="1021" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">34 Save → payment history 33. Upcoming payments open their subscription. 38 Trial → details / reminder.</text></g><g id="Insights &amp; decisions"><rect x="48" y="1072" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="1108" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Insights &amp; decisions</text><rect x="440" y="1088" width="284" height="45" rx="22" fill="#111"/><text x="458" y="1117" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">39 Insights</text><path d="M730 1111h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="1088" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="1117" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">42 Categories</text><path d="M1043 1111h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="1088" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="1117" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">40 Review usage</text><path d="M1356 1111h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="1088" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="1117" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">41 Review price</text><text x="72" y="1169" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">Category → filtered subscriptions. Keep service → 09. Cancel → 35. Price confirm → update 09; reject → keep current price.</text></g><g id="Profile &amp; connections"><rect x="48" y="1220" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="1256" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Profile &amp; connections</text><rect x="440" y="1236" width="284" height="45" rx="22" fill="#111"/><text x="458" y="1265" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">43 Profile → 59</text><path d="M730 1259h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="1236" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="1265" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">44 Gmail connected</text><path d="M1043 1259h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="1236" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="1265" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">45 Disconnect</text><path d="M1356 1259h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="1236" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="1265" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">60 Reconnect → 15</text><text x="72" y="1317" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">44 Scan again → 11. Disconnect preserves saved subscriptions. 46 Preferences → currency 26 / reminder 48.</text></g><g id="Notifications"><rect x="48" y="1368" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="1404" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Notifications</text><rect x="440" y="1384" width="284" height="45" rx="22" fill="#111"/><text x="458" y="1413" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">Home bell → 47</text><path d="M730 1407h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="1384" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="1413" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">14 Preferences</text><path d="M1043 1407h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="1384" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="1413" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">48 Reminder timing</text><path d="M1356 1407h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="1384" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="1413" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">49 System settings</text><text x="72" y="1465" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">Inbox links: renewal → 09; price → 41; found → 12; cancellation → 22. 61 Empty inbox → 31 / 14.</text></g><g id="Privacy &amp; recovery"><rect x="48" y="1516" width="1704" height="132" rx="24" fill="white" stroke="#e8e8e8"/><text x="72" y="1552" font-family="SF Pro Display,Arial" font-size="21" font-weight="650" fill="#111">Privacy &amp; recovery</text><rect x="440" y="1532" width="284" height="45" rx="22" fill="#111"/><text x="458" y="1561" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="white">50 Privacy / export</text><path d="M730 1555h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="753" y="1532" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="771" y="1561" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">53 Sign out → 04</text><path d="M1043 1555h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1066" y="1532" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1084" y="1561" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">54 Delete account</text><path d="M1356 1555h17m-5-5 5 5-5 5" fill="none" stroke="#888" stroke-width="2"/><rect x="1379" y="1532" width="284" height="45" rx="22" fill="#f5f5f5"/><text x="1397" y="1561" font-family="SF Pro Display,Arial" font-size="18" font-weight="550" fill="#111">51 Offline / 52 Retry</text><text x="72" y="1613" font-family="SF Pro Display,Arial" font-size="17" font-weight="400" fill="#666">Export → native share sheet. Delete → identity verification → 04. Offline uses cached data. Help → email composer.</text></g><text x="64" y="1705" font-family="SF Pro Display,Arial" font-size="18" font-weight="400" fill="#666">Back returns to the originating screen. Drafts survive recoverable failures; retries do not create duplicate records.</text></svg>